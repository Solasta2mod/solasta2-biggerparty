[BiggerParty]
; 1 = party size patch active, 0 = vanilla behaviour (Ctrl+Shift+Tab in game toggles this)
Enabled=1
; heroes per party / players per lobby for NEW campaigns and lobbies (4 = vanilla, max 8)
PartySize=6
; human players a hosted session accepts (default = PartySize; 4 keeps the vanilla lobby)
;MaxPlayers=6
; optional: creation camera field-of-view multiplier (default grows with PartySize)
;CameraFovMultiplier=1.35
; hostile monsters' maximum hit points as a percentage of their definition (100 = vanilla; Ctrl+Shift+Up / Down in game changes it by 10)
EnemyHitPointsPercent=100
; 1 = each hero's combat XP is topped up to a four-hero share (the game splits a fight's XP by head count); 0 = the game's split
CombatExperienceAsIfFour=1
